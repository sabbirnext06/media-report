/* ── helpers ─────────────────────────────────────────────────────── */
const fmtK = (n) => {
  if (n == null) return "—";
  if (n >= 1000000) return "$" + (n/1000000).toFixed(2) + "M";
  if (n >= 1000)    return "$" + (n/1000).toFixed(n >= 10000 ? 1 : 2) + "k";
  return "$" + n.toLocaleString();
};
const fmt = (n) => {
  if (n == null) return "—";
  if (n >= 1000000) return (n/1000000).toFixed(2) + "M";
  if (n >= 1000)    return (n/1000).toFixed(1) + "K";
  return Math.round(n).toLocaleString();
};
const fmtUSD = (n) => {
  if (n == null || n === 0) return "$0";
  if (n >= 1000) return "$" + (n/1000).toFixed(1) + "K";
  return "$" + n.toFixed(0);
};
const pctChg = (a, b) => (b && b !== 0) ? ((a - b) / b * 100) : null;

const ChgBadge = ({ v, cap = 9999 }) => {
  if (v == null) return <span style={{color:"#475569",fontSize:"12px",padding:"2px 7px"}}>New</span>;
  if (v > cap)   return <span style={{color:"#22C55E",fontWeight:700,fontSize:"12px",background:"rgba(34,197,94,.1)",padding:"2px 7px",borderRadius:"4px"}}>+{cap}%+</span>;
  const pos = v > 5, neg = v < -5;
  const col = pos ? "#22C55E" : neg ? "#EF4444" : "#94A3B8";
  const bg  = pos ? "rgba(34,197,94,.1)" : neg ? "rgba(239,68,68,.1)" : "transparent";
  return <span style={{color:col,background:bg,padding:"2px 7px",borderRadius:"4px",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:"12px"}}>{v > 0 ? "+" : ""}{v.toFixed(1)}%</span>;
};

);

);
const TD = ({ children, right, bold, muted }) => (
  <td style={{padding:"9px 12px",textAlign:right?"right":"left",fontVariantNumeric:"tabular-nums",color:muted?"#64748B":bold?"#F1F5F9":"#CBD5E1",fontWeight:bold?600:400,fontSize:"13px"}}>
    {children}
  </td>
);
const KpiStrip = ({ cards, cols }) => (
  <div style={{display:"grid",gridTemplateColumns:`repeat(${cols||cards.length},1fr)`,gap:"10px",marginBottom:"20px"}}>
    {cards.map(k => (
      <div key={k.label} style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"10px",padding:"14px 16px"}}>
        <div style={{fontSize:"10px",color:"#64748B",fontWeight:600,marginBottom:"5px",letterSpacing:"0.06em"}}>{k.label.toUpperCase()}</div>
        <div style={{fontSize:"22px",fontWeight:800,color:k.accent}}>{k.val}</div>
        {k.sub && <div style={{fontSize:"11px",color:k.subColor||"#64748B",marginTop:"3px",fontWeight:600}}>{k.sub}</div>}
      </div>
    ))}
  </div>
);
const DataTable = ({ children, search, setSearch, count, placeholder }) => (
  <div>
    <div style={{display:"flex",gap:"10px",alignItems:"center",marginBottom:"12px"}}>
      <input value={search} onChange={e => setSearch(e.target.value)} placeholder={placeholder || "Search…"}
        style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"7px",padding:"7px 13px",color:"#CBD5E1",fontSize:"13px",width:"190px",outline:"none"}}/>
      <span style={{fontSize:"12px",color:"#334155"}}>{count} rows</span>
    </div>
    <div style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"10px",overflow:"hidden"}}>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%",borderCollapse:"collapse"}}>{children}</table>
      </div>
    </div>
  </div>
);

   SUMMARY

function SummarySection() {
  const allSpend = [...SPEND_PRIMARY, ...SPEND_REST];

  const grandAug = allSpend.reduce((s,r) => s + r.aug_spend, 0);
  const mauJulA  = MAU_DATA.reduce((s,r) => s + (r.jul_active||0), 0);
  const mauAugA  = MAU_DATA.reduce((s,r) => s + (r.aug_active||0), 0);
  const comJulA  = COM_DATA.reduce((s,r) => s + (r.jul_active||0), 0);
  const comAugA  = COM_DATA.reduce((s,r) => s + (r.aug_active||0), 0);

  const SectionCard = ({ title, accent, children }) => (

        <span style={{fontSize:"12px",color:"#475569",fontVariantNumeric:"tabular-nums",minWidth:"60px",textAlign:"right"}}>{jul}</span>

      <div style={{display:"flex",gap:"10px",alignItems:"flex-start",padding:"8px 12px",background:s.bg,border:`1px solid ${s.border}`,borderRadius:"8px",marginBottom:"8px"}}>

    <div style={{display:"flex",justifyContent:"flex-end",gap:"16px",paddingBottom:"6px",marginBottom:"4px",borderBottom:"1px solid #1E293B"}}>

          {label:"P2D Revenue",      jul:fmtK(36400),  aug:fmtK(82100),   chg:pctChg(82100,36400),     accent:"#FB923C"},

          <div key={k.label} style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"10px",padding:"14px 16px"}}>

      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px"}}>
        <SectionCard title="Revenue by Channel" accent="#10B981">

          <MetaRow label="P2D"      jul={fmtK(36400)}  aug={fmtK(82100)}  chg={pctChg(82100,36400)} highlight/>

          <MetaRow label="India (IN)"    jul={fmtK(3843.4)}    aug={fmtK(2143.6)}    chg={pctChg(2143.6,3843.4)}/>

  );
}

              <th style={{padding:"10px 16px",textAlign:"right",fontSize:"11px",fontWeight:600,color:"#475569",letterSpacing:"0.04em"}}>JUL 2026</th>
              <th style={{padding:"10px 16px",textAlign:"right",fontSize:"11px",fontWeight:600,color:"#475569",letterSpacing:"0.04em"}}>AUG 2026</th>
              <th style={{padding:"10px 16px",textAlign:"right",fontSize:"11px",fontWeight:600,color:"#475569",letterSpacing:"0.04em"}}>MoM</th>
              <th style={{padding:"10px 16px",textAlign:"right",fontSize:"11px",fontWeight:600,color:"#475569",letterSpacing:"0.04em"}}>DELTA</th>

          <tbody>
            <tr style={{background:"rgba(16,185,129,.07)",borderBottom:"2px solid #1E293B"}}>
              <td style={{padding:"12px 16px"}}>
                <div style={{display:"flex",alignItems:"center",gap:"10px"}}>
                  <div style={{width:"10px",height:"10px",borderRadius:"50%",background:"#10B981",flexShrink:0}}/>

                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   AD SPEND — shared table
══════════════════════════════════════════════════════════════════ */
function SpendTable({ data, grandJul, grandAug }) {
  const [sk, setSk] = useState("aug_spend");
  const [sd, setSd] = useState("desc");
  const [q,  setQ]  = useState("");
  const toggle = (k) => { if (sk===k) setSd(d => d==="asc"?"desc":"asc"); else { setSk(k); setSd("desc"); } };
  const julTotal = data.reduce((s,r) => s+r.jul_spend, 0);
  const augTotal = data.reduce((s,r) => s+r.aug_spend, 0);
  const totChg   = julTotal > 0 ? ((augTotal-julTotal)/julTotal*100) : null;
  const rows = useMemo(() =>
    [...data.filter(r => (r.Country_Name||r.Country).toLowerCase().includes(q.toLowerCase()))]
      .sort((a,b) => sd==="desc" ? (b[sk]??-Infinity)-(a[sk]??-Infinity) : (a[sk]??-Infinity)-(b[sk]??-Infinity)),
    [sk, sd, q, data]
  );
  return (
    <div>
      <KpiStrip cards={[
        {label:"Jul Spend (subset)", val:"$"+julTotal.toLocaleString("en-US",{maximumFractionDigits:0}), accent:"#64748B", sub:((julTotal/grandJul)*100).toFixed(1)+"% of total Jul"},
        {label:"Aug Spend (subset)", val:"$"+augTotal.toLocaleString("en-US",{maximumFractionDigits:0}), accent:"#F97316", sub:totChg!=null?(totChg>0?"+":"")+totChg.toFixed(1)+"% vs Jul":"—", subColor:totChg!=null&&totChg>=0?"#22C55E":"#EF4444"},
        {label:"Aug Share of Total", val:((augTotal/grandAug)*100).toFixed(1)+"%", accent:"#FB923C"},
        {label:"Countries",          val:data.length,                              accent:"#94A3B8"},
      ]}/>
      <DataTable search={q} setSearch={setQ} count={rows.length} placeholder="Search country…">
        <thead><tr style={{background:"#0F172A"}}>
          <TH col="Country_Name" sk={sk} sd={sd} onSort={toggle}>Country</TH>
          <TH col="jul_spend"   sk={sk} sd={sd} onSort={toggle} right>Jul Spend</TH>
          <TH col="aug_spend"   sk={sk} sd={sd} onSort={toggle} right>Aug Spend</TH>
          <TH col="spend_chg"  sk={sk} sd={sd} onSort={toggle} right>MoM</TH>
          <th style={{padding:"9px 12px",fontSize:"11px",fontWeight:600,color:"#475569",whiteSpace:"nowrap"}}>Aug Share</th>
        </tr></thead>
        <tbody>
          {rows.map((r, i) => {
            const name = r.Country_Name || r.Country;
            const barW = augTotal > 0 ? Math.min(r.aug_spend/augTotal*100*5, 100) : 0;
            return (
              <tr key={r.Country} style={{borderTop:"1px solid #1A2332",background:i%2?"rgba(255,255,255,.01)":"transparent"}}>
                <td style={{padding:"9px 12px",color:"#CBD5E1",fontWeight:500,fontSize:"13px"}}>
                  <span style={{fontSize:"10px",color:"#334155",marginRight:"5px"}}>#{i+1}</span>{name}
                </td>
                <TD right muted>{fmtUSD(r.jul_spend)}</TD>
                <TD right bold>{fmtUSD(r.aug_spend)}</TD>
                <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.spend_chg} cap={3500}/></td>
                <td style={{padding:"9px 12px"}}>
                  <div style={{display:"flex",alignItems:"center",gap:"8px"}}>
                    <div style={{height:"6px",borderRadius:"3px",background:"rgba(249,115,22,.12)",width:"80px",overflow:"hidden"}}>
                      <div style={{height:"100%",width:barW+"%",background:"#F97316",borderRadius:"3px"}}/>
                    </div>
                    <span style={{fontSize:"12px",color:"#94A3B8",minWidth:"36px"}}>
                      {augTotal>0?(r.aug_spend/augTotal*100).toFixed(1)+"%":"—"}
                    </span>
                  </div>
                </td>
              </tr>
            );
          })}
          <tr style={{borderTop:"2px solid #334155",background:"rgba(249,115,22,.06)"}}>
            <td style={{padding:"9px 12px",color:"#F97316",fontWeight:700,fontSize:"13px"}}>SUBTOTAL</td>
            <td style={{padding:"9px 12px",textAlign:"right",color:"#F97316",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:"13px"}}>{fmtUSD(julTotal)}</td>
            <td style={{padding:"9px 12px",textAlign:"right",color:"#F97316",fontWeight:700,fontVariantNumeric:"tabular-nums",fontSize:"13px"}}>{fmtUSD(augTotal)}</td>
            <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={totChg} cap={3500}/></td>
            <td style={{padding:"9px 12px",color:"#F97316",fontWeight:700,fontSize:"13px"}}>{((augTotal/grandAug)*100).toFixed(1)}% of total</td>
          </tr>
        </tbody>
      </DataTable>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   TRAFFIC — MAU
══════════════════════════════════════════════════════════════════ */
function MauTab() {
  const [sk, setSk] = useState("aug_active");
  const [sd, setSd] = useState("desc");
  const [q,  setQ]  = useState("");
  const toggle = (k) => { if (sk===k) setSd(d => d==="asc"?"desc":"asc"); else { setSk(k); setSd("desc"); } };
  const tot = (key) => MAU_DATA.reduce((s,r) => s+(r[key]||0), 0);
  const pct = (a,b) => b ? ((a-b)/b*100).toFixed(1) : null;
  const rows = useMemo(() =>
    [...MAU_DATA.filter(r => r.Country && r.Country.toLowerCase().includes(q.toLowerCase()))]
      .sort((a,b) => sd==="desc" ? (b[sk]??-Infinity)-(a[sk]??-Infinity) : (a[sk]??-Infinity)-(b[sk]??-Infinity)),
    [sk, sd, q]
  );
  const [julA,augA,julN,augN,julS,augS] = [tot("jul_active"),tot("aug_active"),tot("jul_new"),tot("aug_new"),tot("jul_sess"),tot("aug_sess")];
  return (
    <div>
      <p style={{fontSize:"12px",color:"#64748B",margin:"0 0 16px"}}>FNMarkets | GA4 · Mauritius entity · {MAU_DATA.length} countries</p>
      <KpiStrip cards={[
        {label:"Jul Active Users", val:fmt(julA), accent:"#64748B"},
        {label:"Aug Active Users", val:fmt(augA), accent:"#3B82F6", sub:(pct(augA,julA)??"—")+"%", subColor:augA>=julA?"#22C55E":"#EF4444"},
        {label:"Aug New Users",    val:fmt(augN), accent:"#6366F1", sub:(pct(augN,julN)??"—")+"% vs Jul", subColor:augN>=julN?"#22C55E":"#EF4444"},
        {label:"Aug Sessions",     val:fmt(augS), accent:"#8B5CF6", sub:(pct(augS,julS)??"—")+"% vs Jul", subColor:augS>=julS?"#22C55E":"#EF4444"},
      ]}/>
      <DataTable search={q} setSearch={setQ} count={rows.length} placeholder="Search country…">
        <thead><tr style={{background:"#0F172A"}}>
          <TH col="Country"    sk={sk} sd={sd} onSort={toggle}>Country</TH>
          <TH col="jul_active" sk={sk} sd={sd} onSort={toggle} right>Jul Active</TH>
          <TH col="aug_active" sk={sk} sd={sd} onSort={toggle} right>Aug Active</TH>
          <TH col="active_chg" sk={sk} sd={sd} onSort={toggle} right>Active MoM</TH>
          <TH col="jul_new"    sk={sk} sd={sd} onSort={toggle} right>Jul New</TH>
          <TH col="aug_new"    sk={sk} sd={sd} onSort={toggle} right>Aug New</TH>
          <TH col="new_chg"    sk={sk} sd={sd} onSort={toggle} right>New MoM</TH>
          <TH col="jul_sess"   sk={sk} sd={sd} onSort={toggle} right>Jul Sessions</TH>
          <TH col="aug_sess"   sk={sk} sd={sd} onSort={toggle} right>Aug Sessions</TH>
          <TH col="sess_chg"   sk={sk} sd={sd} onSort={toggle} right>Sessions MoM</TH>
          <TH col="aug_bounce" sk={sk} sd={sd} onSort={toggle} right>Bounce Rate</TH>
        </tr></thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={r.Country} style={{borderTop:"1px solid #1A2332",background:i%2?"rgba(255,255,255,.01)":"transparent"}}>
              <TD><span style={{fontSize:"10px",color:"#334155",marginRight:"5px"}}>#{i+1}</span>{r.Country}</TD>
              <TD right muted>{fmt(r.jul_active)}</TD>
              <TD right bold>{fmt(r.aug_active)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.active_chg} cap={500}/></td>
              <TD right muted>{fmt(r.jul_new)}</TD>
              <TD right>{fmt(r.aug_new)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.new_chg} cap={500}/></td>
              <TD right muted>{fmt(r.jul_sess)}</TD>
              <TD right>{fmt(r.aug_sess)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.sess_chg} cap={500}/></td>
              <TD right muted>{r.aug_bounce!=null?(r.aug_bounce*100).toFixed(1)+"%":"—"}</TD>
            </tr>
          ))}
        </tbody>
      </DataTable>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   TRAFFIC — COM
══════════════════════════════════════════════════════════════════ */
function ComTab() {
  const [sk, setSk] = useState("aug_active");
  const [sd, setSd] = useState("desc");
  const [q,  setQ]  = useState("");
  const toggle = (k) => { if (sk===k) setSd(d => d==="asc"?"desc":"asc"); else { setSk(k); setSd("desc"); } };
  const tot = (key) => COM_DATA.reduce((s,r) => s+(r[key]||0), 0);
  const rows = useMemo(() =>
    [...COM_DATA.filter(r => r.Country && r.Country.toLowerCase().includes(q.toLowerCase()))]
      .sort((a,b) => sd==="desc" ? (b[sk]??-Infinity)-(a[sk]??-Infinity) : (a[sk]??-Infinity)-(b[sk]??-Infinity)),
    [sk, sd, q]
  );
  const [julA,augA,julN,augN,julE,augE] = [tot("jul_active"),tot("aug_active"),tot("jul_new"),tot("aug_new"),tot("jul_eng"),tot("aug_eng")];
  return (
    <div>
      <p style={{fontSize:"12px",color:"#64748B",margin:"0 0 4px"}}>FNMarkets Global | GA4 · COM entity · {COM_DATA.length} countries</p>
      <p style={{fontSize:"11px",color:"#F59E0B",margin:"0 0 16px"}}>⚠ COM was early-stage in July — MoM figures reflect a near-launch baseline</p>
      <KpiStrip cards={[
        {label:"Jul Active Users",      val:fmt(julA), accent:"#64748B"},
        {label:"Aug Active Users",      val:fmt(augA), accent:"#8B5CF6", sub:"~"+(augA/julA).toFixed(0)+"× vs Jul", subColor:"#22C55E"},
        {label:"Aug New Users",         val:fmt(augN), accent:"#6366F1", sub:"~"+(augN/julN).toFixed(0)+"× vs Jul", subColor:"#22C55E"},
        {label:"Aug Engaged Sessions",  val:fmt(augE), accent:"#A855F7", sub:"~"+(augE/julE).toFixed(0)+"× vs Jul", subColor:"#22C55E"},
      ]}/>
      <DataTable search={q} setSearch={setQ} count={rows.length} placeholder="Search country…">
        <thead><tr style={{background:"#0F172A"}}>
          <TH col="Country"    sk={sk} sd={sd} onSort={toggle}>Country</TH>
          <TH col="jul_active" sk={sk} sd={sd} onSort={toggle} right>Jul Active</TH>
          <TH col="aug_active" sk={sk} sd={sd} onSort={toggle} right>Aug Active</TH>
          <TH col="active_chg" sk={sk} sd={sd} onSort={toggle} right>Active MoM</TH>
          <TH col="jul_new"    sk={sk} sd={sd} onSort={toggle} right>Jul New</TH>
          <TH col="aug_new"    sk={sk} sd={sd} onSort={toggle} right>Aug New</TH>
          <TH col="new_chg"    sk={sk} sd={sd} onSort={toggle} right>New MoM</TH>
          <TH col="jul_eng"    sk={sk} sd={sd} onSort={toggle} right>Jul Engaged Sess.</TH>
          <TH col="aug_eng"    sk={sk} sd={sd} onSort={toggle} right>Aug Engaged Sess.</TH>
          <TH col="eng_chg"    sk={sk} sd={sd} onSort={toggle} right>Eng. Sess. MoM</TH>
        </tr></thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={r.Country} style={{borderTop:"1px solid #1A2332",background:i%2?"rgba(255,255,255,.01)":"transparent"}}>
              <TD><span style={{fontSize:"10px",color:"#334155",marginRight:"5px"}}>#{i+1}</span>{r.Country}</TD>
              <TD right muted>{fmt(r.jul_active)}</TD>
              <TD right bold>{fmt(r.aug_active)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.active_chg} cap={500}/></td>
              <TD right muted>{fmt(r.jul_new)}</TD>
              <TD right>{fmt(r.aug_new)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.new_chg} cap={500}/></td>
              <TD right muted>{fmt(r.jul_eng)}</TD>
              <TD right>{fmt(r.aug_eng)}</TD>
              <td style={{padding:"9px 12px",textAlign:"right"}}><ChgBadge v={r.eng_chg} cap={500}/></td>
            </tr>
          ))}
        </tbody>
      </DataTable>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   ACTION SUMMARY
══════════════════════════════════════════════════════════════════ */
function ActionSummarySection() {
  const Block = ({ title, accent, icon, items }) => (
    <div style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"12px",overflow:"hidden",marginBottom:"16px"}}>
      <div style={{padding:"14px 20px",borderBottom:"1px solid #1E293B",display:"flex",alignItems:"center",gap:"10px"}}>
        <span style={{fontSize:"16px"}}>{icon}</span>
        <span style={{fontSize:"14px",fontWeight:700,color:"#F1F5F9"}}>{title}</span>
        <div style={{marginLeft:"auto",width:"8px",height:"8px",borderRadius:"50%",background:accent}}/>
      </div>
      <div style={{padding:"16px 20px",display:"flex",flexDirection:"column",gap:"10px"}}>
        {items.map((item, i) => (
          <div key={i} style={{display:"flex",gap:"12px",alignItems:"flex-start"}}>
            <div style={{marginTop:"6px",width:"7px",height:"7px",borderRadius:"50%",background:accent,flexShrink:0}}/>
            <p style={{margin:0,fontSize:"13px",color:"#CBD5E1",lineHeight:"1.65"}}>{item}</p>
          </div>
        ))}
      </div>
    </div>
  );

  return (
    <div>
      <p style={{fontSize:"12px",color:"#64748B",margin:"0 0 20px"}}>Strategic context, ongoing initiatives, and open questions · As of August 2026</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"16px"}}>
        <Block title="Actions Taken So Far" accent="#22C55E" icon="✅" items={[
          "Running ads with refreshed creatives that position FNmarkets as an educator.",
          "Shifted budget towards countries with strong IB Network (Nigeria). More countries to be added as IB onboarding continues.",
          "Prioritising entities based on ease of market access — factoring in KYC complexity and availability of local payment methods.",
          "Looking to activate $10 Minimum Deposit for Nigeria and India by next week.",
        ]}/>
        <Block title="Action Plans" accent="#3B82F6" icon="🗺️" items={[
          "Collaborating with CPM to generate and run Creator UGCs and Partnership Ads.",
          "Building Social Media awareness in Nigeria. CPM is planning to promote FNmarkets through Radio Shows and IBs, giving traders a 360° TOMA of FNmarkets.",
        ]}/>
        <Block title="Proposal" accent="#A855F7" icon="💡" items={[
          "Run a Prop Survey to gauge how many existing prop traders are interested in Brokerage, and understand entry condition preferences (minimum deposit, leverage, instruments, KYC requirements).",
        ]}/>
        <div style={{display:"flex",flexDirection:"column",gap:"16px"}}>
          <Block title="Open Questions" accent="#F59E0B" icon="❓" items={[
            "What is our next target license, what is the estimated timeline to obtain it, and when can we start preparing the marketing plan?",
          ]}/>
          <div style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"12px",padding:"16px 20px"}}>
            <div style={{fontSize:"10px",color:"#64748B",fontWeight:600,letterSpacing:"0.08em",marginBottom:"12px"}}>STATUS LEGEND</div>
            {[
              {color:"#22C55E",label:"Actions Taken",  desc:"In progress or already live"},
              {color:"#3B82F6",label:"Action Plans",   desc:"Agreed and being executed"},
              {color:"#A855F7",label:"Proposal",       desc:"Under consideration — needs alignment"},
              {color:"#F59E0B",label:"Open Question",  desc:"Awaiting input / decision pending"},
            ].map(s => (
              <div key={s.label} style={{display:"flex",alignItems:"center",gap:"10px",marginBottom:"8px"}}>
                <div style={{width:"8px",height:"8px",borderRadius:"50%",background:s.color,flexShrink:0}}/>
                <span style={{fontSize:"12px",color:"#F1F5F9",fontWeight:600,minWidth:"110px"}}>{s.label}</span>
                <span style={{fontSize:"12px",color:"#475569"}}>{s.desc}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════
   ROOT
══════════════════════════════════════════════════════════════════ */
function App() {
  const [section,    setSection]    = useState("summary");
  const [trafficTab, setTrafficTab] = useState("MAU");
  const [spendTab,   setSpendTab]   = useState("primary");

  const allSpend = [...SPEND_PRIMARY, ...SPEND_REST];
  const grandJul = allSpend.reduce((s,r) => s+r.jul_spend, 0);
  const grandAug = allSpend.reduce((s,r) => s+r.aug_spend, 0);

  const NAV = [
    {id:"summary", label:"📋 Summary",       color:"#6366F1"},
    {id:"revenue", label:"💵 Revenue",        color:"#10B981"},
    {id:"spend",   label:"💰 Ad Spend",       color:"#F97316"},
    {id:"traffic", label:"📊 Traffic",        color:"#3B82F6"},
    {id:"actions", label:"📌 Action Summary", color:"#A855F7"},
  ];

  return (
    <div style={{padding:"24px",maxWidth:"1400px",margin:"0 auto"}}>
      <div style={{marginBottom:"24px"}}>
        <div style={{fontSize:"11px",letterSpacing:"0.1em",color:"#64748B",marginBottom:"5px",fontWeight:600}}>FNMARKETS · PERFORMANCE REPORT</div>
        <h1 style={{fontSize:"22px",fontWeight:700,color:"#F8FAFC",margin:0}}>July vs August 2026</h1>
      </div>

      <div style={{display:"flex",gap:"8px",marginBottom:"24px",flexWrap:"wrap"}}>
        {NAV.map(n => (
          <button key={n.id} onClick={() => setSection(n.id)} style={{
            padding:"9px 20px",borderRadius:"8px",fontWeight:700,fontSize:"13px",
            cursor:"pointer",border:"none",
            background:section===n.id?n.color:"#1E293B",
            color:section===n.id?"#fff":"#64748B",
          }}>{n.label}</button>
        ))}
      </div>

      {section==="summary" && <SummarySection/>}
      {section==="revenue" && <RevenueSection/>}

      {section==="spend" && (
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:"10px",marginBottom:"20px"}}>
            {[
              {label:"Jul Total Spend", val:"$"+grandJul.toLocaleString("en-US",{maximumFractionDigits:0}), accent:"#64748B"},
              {label:"Aug Total Spend", val:"$"+grandAug.toLocaleString("en-US",{maximumFractionDigits:0}), accent:"#F97316",
                sub:(((grandAug-grandJul)/grandJul)*100).toFixed(1)+"% vs Jul",
                subColor:(grandAug-grandJul)>=0?"#22C55E":"#EF4444"},
              {label:"Meta · "+allSpend.length+" Countries", val:"Primary: "+SPEND_PRIMARY.length+"  ·  Rest: "+SPEND_REST.length, accent:"#94A3B8"},
            ].map(k => (
              <div key={k.label} style={{background:"#111827",border:"1px solid #1E293B",borderRadius:"10px",padding:"14px 16px"}}>
                <div style={{fontSize:"10px",color:"#64748B",fontWeight:600,marginBottom:"5px",letterSpacing:"0.06em"}}>{k.label.toUpperCase()}</div>
                <div style={{fontSize:"20px",fontWeight:800,color:k.accent}}>{k.val}</div>
                {k.sub && <div style={{fontSize:"11px",color:k.subColor||"#64748B",marginTop:"3px",fontWeight:600}}>{k.sub}</div>}
              </div>
            ))}
          </div>
          <div style={{display:"flex",gap:"6px",marginBottom:"20px"}}>
            {[["primary","Primary Markets","#F97316"],["rest","Rest Markets","#94A3B8"]].map(([id,lbl,col]) => (
              <button key={id} onClick={() => setSpendTab(id)} style={{padding:"7px 20px",borderRadius:"6px",fontWeight:600,fontSize:"13px",cursor:"pointer",border:"none",background:spendTab===id?col:"#1A2332",color:spendTab===id?"#fff":"#475569"}}>{lbl}</button>
            ))}
          </div>
          {spendTab==="primary" && <div><p style={{fontSize:"12px",color:"#64748B",margin:"0 0 16px"}}>24 defined primary markets · Meta Ads Manager</p><SpendTable data={SPEND_PRIMARY} grandJul={grandJul} grandAug={grandAug}/></div>}
          {spendTab==="rest"    && <div><p style={{fontSize:"12px",color:"#64748B",margin:"0 0 16px"}}>All remaining countries outside primary markets · Meta Ads Manager</p><SpendTable data={SPEND_REST} grandJul={grandJul} grandAug={grandAug}/></div>}
        </div>
      )}

      {section==="traffic" && (
        <div>
          <div style={{display:"flex",gap:"6px",marginBottom:"20px"}}>
            {[["MAU","MAU","#3B82F6"],["COM","COM","#8B5CF6"]].map(([id,lbl,col]) => (
              <button key={id} onClick={() => setTrafficTab(id)} style={{padding:"7px 20px",borderRadius:"6px",fontWeight:600,fontSize:"13px",cursor:"pointer",border:"none",background:trafficTab===id?col:"#1A2332",color:trafficTab===id?"#fff":"#475569"}}>{lbl}</button>
            ))}
          </div>
          {trafficTab==="MAU" && <MauTab/>}
          {trafficTab==="COM" && <ComTab/>}
        </div>
      )}

      {section==="actions" && <ActionSummarySection/>}

      <div style={{marginTop:"16px",fontSize:"11px",color:"#1E293B"}}>
        Revenue: Internal BI · Spend: Meta Ads Manager · Traffic: FNMarkets GA4 · Jul 1–31 &amp; Aug 1–31, 2026
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
